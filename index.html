<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sam Run 3D</title>
  <meta name="description" content="Sam Run 3D — the endless runner nobody asked for. Dodge banana slugs, the Loop bus and 8AM midterms across UCSC." />
  <meta name="theme-color" content="#f49a7a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sam Run 3D" />
  <meta property="og:title" content="Sam Run 3D" />
  <meta property="og:description" content="Run, Sam, run. Dodge banana slugs, the Loop bus and 8AM midterms." />
  <meta property="og:image" content="/icon-512.png" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- hand-drawn icon set -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-dumbbell" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <rect x="7" y="10.5" width="10" height="3" rx="1" fill="#e0a400"/>
        <rect x="3.5" y="6" width="4" height="12" rx="1.5" fill="#ffc933"/>
        <rect x="16.5" y="6" width="4" height="12" rx="1.5" fill="#ffc933"/>
        <rect x="1" y="8.5" width="3" height="7" rx="1" fill="#ffc933"/>
        <rect x="20" y="8.5" width="3" height="7" rx="1" fill="#ffc933"/></g></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <rect x="6" y="1.5" width="12" height="21" rx="2.5" fill="#2a2140"/>
        <rect x="7.8" y="4" width="8.4" height="14.5" rx="1" fill="#ff5c8a" stroke="none"/></g>
        <path d="M12 15.2l-2.6-2.5a1.6 1.6 0 0 1 2.3-2.3l.3.3.3-.3a1.6 1.6 0 0 1 2.3 2.3z" fill="#fff"/></symbol>
      <symbol id="i-boost" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" fill="#ff7a1a"/>
        <path d="M7 16l5-4 5 4M7 11.5l5-4 5 4" fill="none" stroke="#fff3c4" stroke-width="2.4" stroke-linecap="round"/></g></symbol>
      <symbol id="i-cup" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4.5 5h15l-2 17h-11z" fill="#d4202c"/>
        <path d="M4 3.5h16v2.8H4z" fill="#fff"/>
        <path d="M6.2 11h11.6M6.7 15h10.6" stroke="#ff8a8f" stroke-width="1.2"/></g></symbol>
      <symbol id="i-shake" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <path d="M6.5 7h11l-1 15h-9z" fill="#eae6f2"/>
        <path d="M7.1 12.5h9.8l-.6 9.5H7.7z" fill="#8b4a26" stroke="none"/>
        <rect x="6" y="3.5" width="12" height="4" rx="1" fill="#2a2140"/>
        <rect x="10" y="1" width="4" height="3" rx=".8" fill="#2a2140"/></g></symbol>
      <symbol id="i-bandage" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <rect x="1.5" y="8" width="21" height="8" rx="4" fill="#f2c79a" transform="rotate(-35 12 12)"/>
        <rect x="8.5" y="8.5" width="7" height="7" rx="1" fill="#fff0de" transform="rotate(-35 12 12)"/></g>
        <circle cx="11" cy="11.3" r=".8" fill="#c99a6a"/><circle cx="13" cy="12.7" r=".8" fill="#c99a6a"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <path d="M7 5H3.5v2.5A3.5 3.5 0 0 0 7 11M17 5h3.5v2.5A3.5 3.5 0 0 1 17 11" fill="none"/>
        <path d="M6.5 2.5h11V9a5.5 5.5 0 0 1-11 0z" fill="#ffc933"/>
        <path d="M10.5 14.5h3v3h-3z" fill="#e0a400"/>
        <rect x="7" y="17.5" width="10" height="4" rx="1" fill="#7b3f26"/></g></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><g stroke="#1b1030" stroke-width="1.6" stroke-linejoin="round">
        <path d="M3 18L2 7l5.5 4.5L12 4l4.5 7.5L22 7l-1 11z" fill="#ffc933"/>
        <rect x="3" y="18" width="18" height="3" rx="1" fill="#e0a400"/></g>
        <circle cx="12" cy="14" r="1.4" fill="#ff5c8a"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <canvas id="game"></canvas>

  <div id="flash"></div>
  <div id="drunkfx"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div id="score" class="big">0</div>
      <div id="mult" class="chip hidden">x2</div>
    </div>
    <div class="hud-right">
      <div class="chip"><svg class="ico"><use href="#i-dumbbell"/></svg><span id="gains">0</span></div>
      <div class="chip"><svg class="ico"><use href="#i-phone"/></svg><span id="digits">0</span></div>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause"><svg class="ico"><use href="#i-pause"/></svg></button>
    </div>
    <div id="powers"></div>
  </div>

  <div id="toast"></div>

  <!-- Loading -->
  <div id="loading" class="screen">
    <div class="title small">SAM RUN <span>3D</span></div>
    <div class="bar"><div id="barFill"></div></div>
    <div id="loadText">Loading Sam's pre-workout…</div>
  </div>

  <!-- Menu -->
  <div id="menu" class="screen hidden">
    <div class="top">
      <div class="title">SAM RUN <span>3D</span></div>
      <div class="sub">Cowell College · UC Santa Cruz</div>
    </div>
    <div class="bottom">
      <div id="bestLine" class="best"></div>
      <button id="playBtn" class="btn primary">TAP TO RUN</button>
      <div class="credit">
        <svg class="crown"><use href="#i-crown"/></svg>
        <div class="credit-line">Made by the coolest roommate Joe</div>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="title small">PAUSED</div>
      <div class="sub">Sam is checking his Hinge.</div>
      <button id="resumeBtn" class="btn primary">RESUME</button>
      <button id="quitBtn" class="btn">MAIN MENU</button>
    </div>
  </div>

  <!-- Game over -->
  <div id="over" class="screen dim hidden">
    <div class="panel">
      <div class="title small">WIPED OUT</div>
      <div id="roast" class="roast"></div>
      <div class="stats">
        <div><span>Score</span><b id="oScore">0</b></div>
        <div><span>Distance</span><b id="oDist">0m</b></div>
        <div><span>Gains</span><b id="oGains">0</b></div>
        <div><span>Numbers</span><b id="oDigits">0</b></div>
      </div>
      <div id="newBest" class="newbest hidden"><svg class="ico"><use href="#i-trophy"/></svg> NEW PERSONAL RECORD</div>
      <div id="oBest" class="best"></div>
      <button id="againBtn" class="btn primary">RUN IT BACK</button>
      <div class="row">
        <button id="shareBtn" class="btn">SHARE</button>
        <button id="menuBtn" class="btn">MENU</button>
      </div>
    </div>
  </div>


  <script type="module" src="/src/main.js"></script>
</body>
</html>
